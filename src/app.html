<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			Google's favicon crawler does not accept SVG: its documented formats are
			BMP, GIF, ICO, PNG, JPEG, PPM and TIFF, so an SVG-only declaration gets a
			default globe in search results. The .ico at the root is what Search
			actually indexes; the SVG is what modern browsers prefer.

			`sizes="32x32"` on the .ico is load-bearing, not decoration. Chrome only
			prefers the SVG when the .ico carries an explicit pixel size; `sizes="any"`
			does not work. Regenerate the set with `bun run icons:build`.
		-->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#20234d" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Blocking, before first paint. mode-watcher only applies .dark after
			// hydration, so without this a visitor sees a white flash on every cold
			// load. Mirrors mode-watcher's own storage key and its `defaultMode`.
			(function () {
				var dark = true; // dark is the default, so it is also the fallback
				try {
					var stored = localStorage.getItem('mode-watcher-mode');
					dark =
						stored !== 'light' &&
						(stored !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches);
				} catch (e) {
					// Private mode or blocked storage: keep the dark default.
				}
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents" class="h-full overflow-hidden">%sveltekit.body%</div>
	</body>
</html>
